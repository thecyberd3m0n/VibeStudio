pluginManagement {
    includeBuild("libtermux-android/build-logic")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files("libtermux-android/gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = "VibeStudio"
include ':app'
// --- Add libtermux-android submodule modules as root projects to satisfy internal dependencies ---
include ':core'
project(':core').projectDir = file('libtermux-android/core')

include ':terminal-view'
project(':terminal-view').projectDir = file('libtermux-android/terminal-view')

include ':bootstrap-arm64'
project(':bootstrap-arm64').projectDir = file('libtermux-android/bootstrap-arm64')

include ':bootstrap-arm'
project(':bootstrap-arm').projectDir = file('libtermux-android/bootstrap-arm')

include ':bootstrap-x86_64'
project(':bootstrap-x86_64').projectDir = file('libtermux-android/bootstrap-x86_64')

include ':bootstrap-x86'
project(':bootstrap-x86').projectDir = file('libtermux-android/bootstrap-x86')

